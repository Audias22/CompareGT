[project]
name = "comparegt"
version = "0.1.0"
description = "comparegt using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]==1.12.2",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.scripts]
comparegt = "comparegt.main:run"
run_crew = "comparegt.main:run"
train = "comparegt.main:train"
replay = "comparegt.main:replay"
test = "comparegt.main:test"
run_with_trigger = "comparegt.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = [
    "lancedb; sys_platform != 'win32'",
]
